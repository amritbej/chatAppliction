name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm --prefix server ci

      - name: Run Backend Tests
        run: npm --prefix server test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_12345
          PAYMENT_PROVIDER: mock

  web-build:
    name: Web Client Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm --prefix client ci

      - name: Build Web Application
        run: npm --prefix client run build

  mobile-typecheck:
    name: Mobile Client Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Install Dependencies
        run: npm --prefix mobile install

      - name: Run TypeScript Typecheck
        run: npm --prefix mobile run typecheck
